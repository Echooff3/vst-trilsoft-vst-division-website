<title>Tril$oft VST Division — Weird VSTs no one asked for</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
/* Pick the layout before first paint (no flash): portrait for tablet-portrait → phone, desktop otherwise. */
(function(d){var p=matchMedia('(max-width: 1024px) and (orientation: portrait)').matches;
d.className+=(p?' is-port':' is-desk')+(matchMedia('(prefers-reduced-motion: reduce)').matches?' static':'');})(document.documentElement);

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Black+Ops+One&family=Comic+Neue:wght@700&family=Share+Tech+Mono&family=Titan+One&family=Unbounded:wght@400;600;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#09090B; --char:#111114; --panel:#16161B;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --bone:#EEE9E0; --mute:#8C8996; --dim:#5D5A66;
  --signal:#FF5B1F; --signal-2:#FF8A3D; --amber:#FFC266;
  --wc-deep:#1E0D4D; --wc-purple:#2D1679; --wc-violet:#4325B5; --wc-lav:#B9ADFF;
  --lime:#9CFF2E; --wc-ink:#100524; --white:#fff;
  --display:"Unbounded",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --comic:"Bangers","Impact",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink)}
body{background:var(--ink);color:var(--bone);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
#app{min-height:100vh;min-height:100svh}

/* header */
header.top{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;height:84px;padding:0 clamp(20px,4vw,56px);pointer-events:none}
header.top>*{pointer-events:auto}
.logo{display:inline-flex;align-items:center;gap:12px}
.wordmark{display:flex;flex-direction:column;line-height:1}
.wordmark b{font-family:var(--display);font-weight:800;font-size:19px;color:var(--bone)}
.wordmark b i,.dollar{font-style:normal;color:var(--signal)}
.wordmark small{font-family:var(--mono);font-size:9px;letter-spacing:.32em;color:var(--mute);margin-top:5px}
.navlink{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone);padding:10px 16px;border:1px solid var(--line-2);border-radius:999px;background:rgba(9,9,11,.4);backdrop-filter:blur(8px);transition:.2s}
.navlink:hover{border-color:var(--signal);color:var(--signal)}
.bar{position:fixed;left:0;top:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);z-index:60;background:linear-gradient(90deg,var(--signal),var(--amber),var(--lime))}

/* pinned stage: native scroll drives a sticky stage */
.scroller{position:relative;z-index:1}
.stage{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;overflow:clip;isolation:isolate}
.scene{position:absolute;inset:0;display:grid;place-items:center;will-change:transform,opacity}

.bg-dark{position:absolute;inset:0;z-index:-3;background:var(--ink);
  background-image:radial-gradient(900px 560px at 50% 38%,rgba(255,91,31,.17),transparent 70%),
  linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:auto,64px 64px,64px 64px;background-position:center}
.bg-dark::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,var(--ink) 85%)}
.waves{position:absolute;left:0;right:0;bottom:8vh;height:28vh;z-index:-2;opacity:.9;pointer-events:none}
.waves path{fill:none;stroke-linecap:round}
.bg-purple{position:absolute;inset:0;z-index:-1;background:var(--wc-purple);
  background-image:radial-gradient(900px 600px at 70% 45%,rgba(156,255,46,.16),transparent 65%),
  radial-gradient(rgba(143,124,255,.32) 1.6px,transparent 1.9px);
  background-size:auto,16px 16px;clip-path:circle(0% at 50% 50%)}
.bg-purple::after{content:"";position:absolute;inset:0;background:radial-gradient(900px 700px at 0% 100%,rgba(16,5,36,.75),transparent 70%)}

/* ghost-fill words */
.w{--a:0;display:inline-block;will-change:transform;color:rgba(238,233,224,calc(.07 + var(--a)*.93))}
em.w,.w em{font-style:normal;background:linear-gradient(90deg,rgba(255,91,31,calc(.12 + var(--a)*.88)),rgba(255,194,102,calc(.12 + var(--a)*.88)));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.04em}
.hint{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
.hint i{display:block;width:1px;height:46px;background:linear-gradient(var(--signal),transparent);animation:drip 1.6s ease-in-out infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

/* lockup type */
.brand{display:flex;align-items:center}
.brand svg{height:auto;overflow:visible}
.brand b{font-family:var(--display);font-weight:800;line-height:1;letter-spacing:-.01em}
.brand b span{display:inline-block}
.vst{font-family:var(--display);font-weight:900;line-height:.92;letter-spacing:-.045em}
.vst .l{display:inline-block;will-change:transform}
.vst .word{display:inline-flex;overflow:hidden;padding:.04em .02em .08em}
.vst .div .l{color:transparent;-webkit-text-stroke:2px var(--signal)}
.vst .div .l.fill{background:linear-gradient(90deg,var(--signal),var(--amber));-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:0!important}
.rule hr{flex:1;border:0;height:1px;background:linear-gradient(90deg,transparent,var(--signal),transparent);transform-origin:center}
.meta span{display:inline-flex;align-items:center;gap:10px}
.meta span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--signal);box-shadow:0 0 10px var(--signal)}

/* Wild Card comic kit */
.tab{display:inline-block;font-family:var(--comic);font-size:20px;letter-spacing:.06em;background:var(--lime);color:var(--wc-ink);
  padding:5px 14px 2px;border:3px solid var(--wc-ink);box-shadow:4px 4px 0 var(--wc-ink);transform:rotate(-1.5deg)}
.wc-title{font-family:var(--comic);font-weight:400;line-height:.86;letter-spacing:.02em;color:var(--lime);-webkit-text-stroke:5px var(--wc-ink);paint-order:stroke fill;text-shadow:9px 9px 0 var(--wc-ink)}
.wc-line{font-family:var(--comic);letter-spacing:.03em;line-height:1.02;color:var(--white);-webkit-text-stroke:2px var(--wc-ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--wc-ink)}
.wc-line em{font-style:normal;color:var(--lime)}
.wc-sub{font-size:17px;color:var(--wc-lav);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;font-family:var(--comic);font-size:26px;letter-spacing:.05em;line-height:1;
  padding:16px 28px 13px;border:4px solid var(--wc-ink);border-radius:14px;box-shadow:6px 6px 0 var(--wc-ink);transition:transform .12s,box-shadow .12s;touch-action:manipulation}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--wc-ink)}
.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--wc-ink)}
.btn-lime{background:var(--lime);color:var(--wc-ink)}
.btn-white{background:var(--white);color:var(--wc-ink)}

/* speech bubbles: body = ::after, tail = ::before, both z-index:-1 inside an isolated stacking
   context. ::after paints after ::before, so the body always covers the tail; text paints on top. */
.bubble{--bg:var(--white);position:absolute;isolation:isolate;display:inline-block;color:var(--wc-ink);font-family:var(--comic);font-size:24px;letter-spacing:.04em;line-height:1.05;padding:18px 26px 15px;white-space:nowrap;z-index:4}
.bubble::after{content:"";position:absolute;inset:0;z-index:-1;background:var(--bg);border:4px solid var(--wc-ink);border-radius:26px;box-shadow:5px 5px 0 var(--wc-ink)}
.bubble::before{content:"";position:absolute;z-index:-1;width:26px;height:26px;background:var(--bg);border:4px solid var(--wc-ink);border-top:0;border-left:0;bottom:-15px;left:38px;transform:skew(28deg) rotate(45deg)}
.bubble.r::before{left:auto;right:42px;transform:skew(-28deg) rotate(45deg)}
.bubble.lime{--bg:var(--lime)}

.deck{position:relative;aspect-ratio:1}
.platter{position:absolute;inset:0;border-radius:50%;background:#1A0B44;border:5px solid var(--wc-ink);box-shadow:12px 12px 0 var(--wc-ink)}
.platter::before{content:"";position:absolute;inset:2%;border-radius:50%;background:radial-gradient(circle,var(--lime) 0 2.3px,transparent 2.8px) 0 0/20px 20px;
  -webkit-mask:radial-gradient(circle,transparent 90.5%,#000 91%);mask:radial-gradient(circle,transparent 90.5%,#000 91%);opacity:.9}
.platter::after{content:"";position:absolute;inset:1%;border-radius:50%;border:3px dashed var(--lime);opacity:.85}
.record{position:absolute;inset:6.2%;border-radius:50%;will-change:transform;
  background:radial-gradient(circle,transparent 0 33%,rgba(255,255,255,.04) 33.3% 34%,transparent 34.5%),
    conic-gradient(from 20deg,rgba(255,255,255,.12),transparent 12%,transparent 38%,rgba(255,255,255,.09) 50%,transparent 62%,transparent 88%,rgba(255,255,255,.12)),
    repeating-radial-gradient(circle,#15121F 0 2px,#221D33 2px 3.2px,#15121F 3.2px 5px);
  border:4px solid var(--wc-ink);box-shadow:inset 0 0 0 10px #0E0B18}
.label{position:absolute;left:50%;top:50%;width:37%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--lime);border:4px solid var(--wc-ink);display:grid;place-items:center;
  background-image:radial-gradient(rgba(16,5,36,.16) 1.3px,transparent 1.6px);background-size:9px 9px;container-type:inline-size}
.label .lt{font-family:var(--comic);font-size:21cqw;margin-top:-30%;letter-spacing:.04em;color:var(--wc-ink);line-height:.86;text-align:center;transform:skew(-6deg)}
.label .lt small{display:block;font-size:7.5cqw;letter-spacing:.18em;margin-top:22%}
.label::before{content:"";position:absolute;left:50%;top:50%;width:9%;height:9%;transform:translate(-50%,-50%);border-radius:50%;background:#EDE9FF;border:3px solid var(--wc-ink);z-index:2}
.marker{position:absolute;left:50%;top:6%;width:2.4%;height:6%;transform:translateX(-50%);background:var(--lime);border:3px solid var(--wc-ink);border-radius:4px}
.tonearm{position:absolute;right:-6%;top:-4%;width:42%;height:auto;z-index:3;transform-origin:85% 12%;filter:drop-shadow(5px 5px 0 var(--wc-ink))}
.strip{background:var(--lime);border-block:4px solid var(--wc-ink);overflow:hidden;white-space:nowrap}
.strip div{display:inline-block;padding:10px 0 6px;font-family:var(--comic);font-size:24px;letter-spacing:.06em;color:var(--wc-ink);will-change:transform}

.after{position:relative;z-index:2;background:#141517 url(/assets/camo-dark.png) center/720px;image-rendering:pixelated;color:#E7E9EC}
.after::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:repeating-linear-gradient(-45deg,#F5A623 0 14px,#141414 14px 28px)}
.after .lab{text-align:center;padding:70px 20px}
.after .lab span{display:inline-flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#F5A623;padding:10px 18px;border:1px dashed rgba(245,166,35,.45);background:rgba(13,14,16,.7);border-radius:999px}
.after .lab span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--signal);box-shadow:0 0 10px var(--signal)}
footer{background:var(--ink);border-top:1px solid var(--line);padding:28px clamp(20px,4vw,56px);padding-bottom:max(28px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
footer .legals{display:flex;gap:18px;align-items:center}
footer a{display:inline-flex;align-items:center;min-height:44px;touch-action:manipulation}
footer a.legal{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
footer a.legal:hover{color:var(--bone)}

/* reduced motion (both versions): no pin, static stacked sections */
html.static .scroller{height:auto!important}
html.static .stage{position:relative;height:auto;overflow:visible}
html.static .scene{position:relative;inset:auto;min-height:100vh;min-height:100svh;opacity:1!important;visibility:visible!important;transform:none!important}
html.static .scene *{opacity:1!important;filter:none!important}
html.static .scene .w,html.static .scene .l,html.static .scene .deck,html.static .scene .wc-title span,html.static .scene .cta,html.static .scene .cta a,html.static .scene .wc-line,html.static .scene .wc-sub,html.static .scene .brand,html.static .scene .brand b span,html.static .scene .meta,html.static .scene .rule hr,html.static .scene .tonearm,html.static .scene .record{transform:none!important}
html.static .w{--a:1}
html.static .vst .div .l{background:linear-gradient(90deg,var(--signal),var(--amber));-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:0!important}
html.static .scene.wc{background:var(--wc-purple);background-image:radial-gradient(rgba(143,124,255,.32) 1.6px,transparent 1.9px);background-size:16px 16px}
html.static .bg-purple,html.static .hint,html.static .bar,html.static .rail,html.static .waves,html.static .edge{display:none}
html.static .bg-dark{position:absolute;inset:0 0 auto 0;height:200vh;height:200svh}
@media (prefers-reduced-motion:reduce){ .hint i{animation:none} }
/* ================= DESKTOP / LANDSCAPE ================= */
.v-desk .scroller{height:1600vh} /* film 620 + paid plug-ins (Conceal-N-Strike 440) + free MIDI Fart Sniffer 440 last, plus the 100vh stage. Insert future paid plug-ins above #mfs. */
.v-desk .s1 .inner{text-align:center;padding:0 24px;max-width:1200px}
.v-desk .s1 .kicker{display:inline-block;margin-bottom:28px;color:var(--signal)}
.v-desk .s1 h1{font-family:var(--display);font-weight:800;font-size:clamp(46px,8vw,124px);line-height:1;letter-spacing:-.035em}
.v-desk .s1 h1 .w{margin:0 .1em}
.v-desk .s2 .inner{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px}
.v-desk .brand{gap:clamp(14px,1.6vw,24px)}
.v-desk .brand svg{width:clamp(56px,6vw,92px)}
.v-desk .brand b{font-size:clamp(34px,4.4vw,66px)}
.v-desk .vst{margin-top:clamp(18px,2.6vw,34px);font-size:clamp(44px,9.4vw,150px);display:flex;gap:.22em;flex-wrap:wrap;justify-content:center}
.v-desk .rule{margin-top:clamp(22px,3vw,38px);display:flex;width:min(760px,86vw)}
.v-desk .meta{margin-top:18px;display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
.v-desk .s3{color:#F4F1FF}
.v-desk .s3 .inner{width:min(1240px,100%);padding:84px clamp(24px,4vw,56px) 40px;display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(20px,3vw,48px);align-items:center}
.v-desk .wc-title{font-size:clamp(84px,11.5vw,184px);margin:24px 0 26px}
.v-desk .wc-title span{display:block;transform-origin:left bottom}
.v-desk .wc-title span:nth-child(2){margin-left:.32em}
.v-desk .wc-line{font-size:clamp(28px,2.8vw,42px)}
.v-desk .wc-sub{margin-top:14px;max-width:470px}
.v-desk .cta{display:flex;gap:18px;flex-wrap:wrap;margin-top:30px}
.v-desk .deck{width:min(560px,44vw,66vh);justify-self:center}
.v-desk .deck .b1{left:-8%;top:-2%;transform-origin:30px 100%}
.v-desk .deck .b2{right:-4%;bottom:4%;transform-origin:80% 100%}
.v-desk .strip{position:absolute;left:-2%;right:-2%;bottom:clamp(14px,3vh,34px);transform:rotate(-1.2deg);z-index:1}
.v-desk .rail{position:fixed;left:50%;top:0;height:84px;transform:translateX(-50%);z-index:55;display:flex;gap:26px;align-items:center}
.v-desk .rail a{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim);transition:color .3s}
.v-desk .rail a i{display:block;width:18px;height:2px;background:currentColor;transition:width .3s}
.v-desk .rail a.on{color:var(--signal)}
.v-desk .rail a.on i{width:34px}
.v-desk .rail.wc a{color:rgba(185,173,255,.55)}
.v-desk .rail.wc a.on{color:var(--lime)}
/* narrow landscape windows (e.g. landscape phones / small laptops) */
@media (max-width:1100px){ .v-desk .rail{display:none} }
@media (max-height:560px){
  .v-desk header.top{height:58px}
  .v-desk .s1 h1{font-size:min(8vw,15vh)}
  .v-desk .vst{font-size:min(9.4vw,19vh);margin-top:10px}
  .v-desk .brand b{font-size:min(4.4vw,9vh)} .v-desk .brand svg{width:min(6vw,12vh)}
  .v-desk .s3 .inner{padding:62px 5vw 24px}
  .v-desk .wc-title{font-size:min(11.5vw,24vh);margin:12px 0;text-shadow:5px 5px 0 var(--wc-ink);-webkit-text-stroke:4px var(--wc-ink)}
  .v-desk .wc-line{font-size:min(2.8vw,6vh)} .v-desk .wc-sub,.v-desk .strip,.v-desk .deck .b2{display:none}
  .v-desk .cta{margin-top:14px;gap:12px} .v-desk .btn{font-size:18px;padding:11px 16px 8px;box-shadow:4px 4px 0 var(--wc-ink)}
  .v-desk .tab{font-size:14px} .v-desk .bubble{font-size:15px;padding:10px 14px 8px}
  .v-desk .deck{width:min(40vw,72vh)}
}
html.static .v-desk .tab{transform:rotate(-1.5deg)!important}
html.static .v-desk .strip{transform:rotate(-1.2deg)!important}
html.static .v-desk .wc-title span{transform:rotate(-3deg) skew(-4deg)!important}
/* ================= PORTRAIT (tablet portrait → phone) ================= */
.v-port{--hdr:64px}
.v-port .scroller{height:1640vh;height:1640svh} /* film 660 + paid 440 + free MIDI Fart Sniffer 440 last, plus the 100vh stage. The free section stays last. */
.v-port header.top{height:var(--hdr);padding:0 20px;padding-top:env(safe-area-inset-top)}
.v-port .wordmark b{font-size:16px}
.v-port .navlink{font-size:11px;padding:11px 14px;min-height:40px;display:inline-flex;align-items:center}
/* Plug-in jump lives on the product pages. The node stays so the film can still update it. */
header.top a.navlink{display:none}
.v-port .bg-dark{background-image:radial-gradient(70vw 50svh at 40% 40%,rgba(255,91,31,.18),transparent 70%),linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:auto,48px 48px,48px 48px}
.v-port .waves{bottom:4svh;height:16svh}

/* beat 1: stacked line */
.v-port .p1{place-items:center start}
.v-port .p1 .inner{padding:0 7vw;width:100%}
.v-port .p1 .kicker{display:block;margin-bottom:3svh;color:var(--signal);font-size:11px}
.v-port .p1 h1{font-family:var(--display);font-weight:800;font-size:min(16.5vw,9.4svh);line-height:1.02;letter-spacing:-.04em}
.v-port .p1 h1 .w{display:block;width:max-content}
.v-port .p1 h1 .w:nth-child(even){margin-left:auto}
.v-port .p1 .hint{bottom:max(26px,calc(env(safe-area-inset-bottom) + 16px))}

/* beat 2: stacked lockup */
.v-port .p2 .inner{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 6vw}
.v-port .brand{gap:14px}
.v-port .brand svg{width:min(14vw,9svh)}
.v-port .brand b{font-size:min(9.4vw,6.2svh)}
.v-port .vst{margin-top:3svh;display:flex;flex-direction:column;align-items:center;gap:0}
.v-port .vst .vstw{font-size:min(30vw,20svh);line-height:.86}
.v-port .vst .div{font-size:min(13.4vw,8.4svh)}
.v-port .vst .div .l{-webkit-text-stroke:1.5px var(--signal)}
.v-port .rule{margin-top:3svh;display:flex;width:80vw}
.v-port .meta{margin-top:2.4svh;display:flex;flex-direction:column;gap:10px;align-items:center;font-size:min(2.8vw,13px)}

/* wipe */
.v-port .edge{position:absolute;left:0;right:0;top:0;height:46px;margin-top:-23px;z-index:0;visibility:hidden}
.v-port .edge div{font-size:20px;padding:8px 0 4px}

/* beat 3: record dominant top half, copy stacked below */
.v-port .p3{color:#F4F1FF;place-items:stretch}

  // ================= desktop renderer =================

        const dk = easeOut(seg(p, .64, .76));
        c.deck.style.transform = `translateY(${(1 - dk) * -75}svh) rotate(${(1 - dk) * -30}deg) scale(${.8 + dk * .2})`;
        c.tonearm.style.transform = `rotate(${(1 - easeIO(seg(p, .75, .81))) * -28}deg)`;
        const tb = back(seg(p, .74, .78)); c.tab.style.transform = `rotate(-1.5deg) scale(${tb})`; c.tab.style.opacity = clamp(tb * 3);
        c.titleS.forEach((s, i) => { const a = .76 + i * .03, t = seg(p, a, a + .055); s.style.transform = `scale(${back(t)}) rotate(${(1 - t) * (i ? 10 : -10) - 3}deg) skew(-4deg)`; s.style.opacity = clamp(t * 4); });
        const ln = easeOut(seg(p, .82, .87)); c.wcline.style.opacity = ln; c.wcline.style.transform = `translateY(${(1 - ln) * 20}px)`;
        const sb = easeOut(seg(p, .84, .89)); c.wcsub.style.opacity = sb; c.wcsub.style.transform = `translateY(${(1 - sb) * 14}px)`;
        c.ctaA.forEach((a, i) => { const t = easeOut(seg(p, .86 + i * .025, .92 + i * .025)); a.style.opacity = t; a.style.transform = `translateY(${(1 - t) * 40}px)`; });
        c.cta.style.pointerEvents = p > .9 ? 'auto' : 'none';
        const bb1 = seg(p, .89, .94);
        c.b1.style.transform = `rotate(-4deg) scale(${back(bb1)})`; show(c.b1, clamp(bb1 * 4));
        if (c.strip) { c.strip.style.transform = `rotate(-1.2deg) translateY(${(1 - easeOut(seg(p, .80, .88))) * 200}%)`; c.marquee(c.strip, p, now); }
        c.spin(p, dp, dt);
      },
      destroy() { removeEventListener('resize', onResize); clearTimeout(rt); }
    };
  }


  // ================= Conceal-N-Strike beat (shared; desktop = diagonal hazard sweep, portrait = blast doors) =================
  // q = 0..1 progress inside one teaser's slice of the scroller. Each Remotion mp4 is scrubbed by currentTime
  // (encoded with a 6-frame GOP so seeks stay cheap). Scroll distances of the older sections stay put.
  // Paid plug-ins come first. The free MIDI Fart Sniffer section stays last: append a future paid
  // section's vh to PAID_* and insert its scene above #mfs. Distances stay 620/1060/1500 and 660/1100/1540.
  const sum = (xs) => xs.reduce((s, n) => s + n, 0);
  const FILM_DESK = 620;
  const PAID_DESK = [440]; // Conceal-N-Strike. Append future paid sections here.
  const MFS_DESK = 440; // free section. Stays after every paid plug-in.
  const RANGE_DESK = FILM_DESK + sum(PAID_DESK) + MFS_DESK; // 1500
  const MFS_AT_DESK = FILM_DESK + sum(PAID_DESK); // 1060 — start of the free section
  const FILM_PORT = 660;
  const PAID_PORT = [440]; // Conceal-N-Strike. Append future paid sections here.
  const MFS_PORT = 440; // free section. Stays after every paid plug-in.
  const RANGE_PORT = FILM_PORT + sum(PAID_PORT) + MFS_PORT; // 1540
  const MFS_AT_PORT = FILM_PORT + sum(PAID_PORT); // 1100 — start of the free section
  function cns(root, mode) {
    const $ = s => root.querySelector(s);
    const sc = $('#cns'), vid = $('#cnsVid'), ui = $('#cnsUi'), bits = [...ui.querySelectorAll('.cns-tag, .cbtn')];
    const wipe = $('#cnsWipe'), dT = $('#doorT'), dB = $('#doorB'), nav = $('#nav'), wc = $('#s3') || $('#p3');
    const rail = $('#rail'), railA = rail ? [...rail.querySelectorAll('a')] : [];
    vid.src = vid.dataset.src; vid.load();
    const prime = () => { const pr = vid.play(); if (pr && pr.then) pr.then(() => vid.pause()).catch(() => {}); else vid.pause(); };
    addEventListener('touchstart', prime, { once: true, passive: true }); // iOS needs a gesture before it decodes for seeking
    let navOn = false;
    return {
      render(q) {
        let covered;
        if (mode === 'desk') {
          const w = easeIO(seg(q, .03, .17)), W = innerWidth, H = innerHeight, sl = .18 * W;
          const X = W + sl - w * (W + 2 * sl);
          sc.style.clipPath = w >= 1 ? 'none' : `polygon(${X + sl / 2}px 0,${W + 10}px 0,${W + 10}px ${H}px,${X - sl / 2}px ${H}px)`;
          show(sc, w > 0 ? 1 : 0);
          wipe.style.visibility = w > 0 && w < 1 ? 'visible' : 'hidden';
          wipe.style.transform = `translateX(${X - 28}px) skewX(${-Math.atan2(sl, H) * 180 / Math.PI}deg)`;
          covered = w >= 1;
        } else {
          const d = easeIO(seg(q, .02, .10)) * (1 - easeIO(seg(q, .13, .22))); // 0 open → 1 shut
          dT.style.transform = `translateY(${(d - 1) * 102}%)`; dB.style.transform = `translateY(${(1 - d) * 102}%)`;
          dT.style.visibility = dB.style.visibility = d > 0.001 ? 'visible' : 'hidden';
          show(sc, q >= .115 ? 1 : 0);
          covered = q >= .115;
        }
        if (covered) wc.style.visibility = 'hidden';
        const t = seg(q, mode === 'desk' ? .16 : .21, .88) * Math.max(0, (vid.duration || 9) - .05);
        if (vid.readyState >= 1 && !vid.seeking && Math.abs(vid.currentTime - t) > .015) { try { vid.currentTime = t; } catch (e) {} }
        bits.forEach((b, i) => { const v = easeOut(seg(q, .84 + i * .025, .9 + i * .025)); b.style.opacity = v; b.style.transform = `translateY(${(1 - v) * 24}px)`; });
        ui.style.pointerEvents = q > .9 && q < 1 ? 'auto' : 'none';
        const on = q > .12 && q < 1;
        if (on !== navOn) { navOn = on; nav.textContent = on ? 'Conceal-N-Strike →' : 'Wild Card →'; nav.href = on ? '/conceal-n-strike' : '/wildcard'; }
        if (rail && q > .1 && q < 1) { railA.forEach((a, i) => a.classList.toggle('on', i === 3)); rail.classList.add('cn'); rail.classList.remove('wc', 'sn'); }
      },
      destroy() { removeEventListener('touchstart', prime); vid.removeAttribute('src'); vid.load(); }
    };
  }

  // ================= MIDI Fart Sniffer beat (concrete slab with leading slime drips, then the scrubbed teaser) =================
  // The free section stays last. This transition runs only after every paid plug-in.
  function mfs(root) {
    const $ = s => root.querySelector(s);
    const sc = $('#mfs'), vid = $('#mfsVid'), ui = $('#mfsUi'), bits = [...ui.querySelectorAll('.mfs-tag, .keyform, .keyfine, .mfs-row')];
    const lid = $('#mfsLid'), nav = $('#nav'), rail = $('#rail'), railA = rail ? [...rail.querySelectorAll('a')] : [];
    vid.src = vid.dataset.src; vid.load();
    const prime = () => { const pr = vid.play(); if (pr && pr.then) pr.then(() => vid.pause()).catch(() => {}); else vid.pause(); };
    addEventListener('touchstart', prime, { once: true, passive: true });
    let navOn = false;
    return {
      render(q) {
        const shut = easeIO(seg(q, 0, .16));
        const open = easeIO(seg(q, .18, .34));
        const y = (-1 + shut) * 128 - open * 142;
        lid.style.visibility = shut > 0.001 && open < 0.999 ? 'visible' : 'hidden';
        lid.style.transform = `translateY(${y}%)`;
        show(sc, q >= .16 ? 1 : 0);
        const t = seg(q, .2, .9) * Math.max(0, (vid.duration || 9) - .05);
        if (vid.readyState >= 1 && !vid.seeking && Math.abs(vid.currentTime - t) > .015) { try { vid.currentTime = t; } catch (e) {} }
        bits.forEach((b, i) => { const v = easeOut(seg(q, .84 + i * .025, .92 + i * .02)); b.style.opacity = v; b.style.transform = `translateY(${(1 - v) * 24}px)`; });
        ui.style.pointerEvents = q > .9 ? 'auto' : 'none';
        const on = q > .12;
        if (on) { nav.textContent = 'MIDI Fart Sniffer →'; nav.href = '/midi-fart-sniffer'; }
        navOn = on;
        if (rail && q > .1) { railA.forEach((a, i) => a.classList.toggle('on', i === 4)); rail.classList.add('sn'); rail.classList.remove('wc', 'cn'); }
      },
      destroy() { removeEventListener('touchstart', prime); vid.removeAttribute('src'); vid.load(); }
    };
  }

  // ================= mount / engine =================
  let active = null; // {mode, scroller, stage, renderer, raf, cur}
  function progressNow() {
    if (!active) return 0;
    if (active.static) { const max = document.documentElement.scrollHeight - innerHeight; return max > 0 ? clamp(scrollY / max) : 0; }
    return active.cur;
  }
  function targetOf(a) {
    const total = a.scroller.offsetHeight - a.stage.offsetHeight;
    return total > 0 ? clamp(-a.scroller.getBoundingClientRect().top / total) : 0;
  }
  function goTo(p, smooth) {
    if (!active) return;
    let top;
    if (active.static) top = (document.documentElement.scrollHeight - innerHeight) * p;
    else top = active.scroller.offsetTop + (active.scroller.offsetHeight - active.stage.offsetHeight) * p;
    scrollTo({ top, behavior: smooth ? 'smooth' : 'instant' });
  }
  function unmount() {
    if (!active) return;
    cancelAnimationFrame(active.raf);
    active.renderer && active.renderer.destroy();
    app.textContent = '';
    active = null;
  }
  function mount(mode, keep = 0) {
    unmount();
    const isStatic = mqRM.matches;
    html.classList.toggle('is-port', mode === 'port');
    html.classList.toggle('is-desk', mode === 'desk');
    html.classList.toggle('static', isStatic);
    const tpl = document.getElementById(mode === 'port' ? 'tpl-port' : 'tpl-desk');
    app.appendChild(tpl.content.cloneNode(true));
    const root = app.firstElementChild;
    root.querySelectorAll('.stripTxt').forEach(el => el.textContent = UNIT.repeat(8));
    if (isStatic) root.querySelectorAll('video[data-end]').forEach(v => { v.poster = v.dataset.end; });
    const a = active = { mode, static: isStatic, root, scroller: root.querySelector('#scroller'), stage: root.querySelector('#stage'), cur: 0 };
    root.style.setProperty('--sh', a.stage.offsetHeight + 'px');
    goTo(keep, false);
    if (isStatic) return;
    const base = (mode === 'port' ? port : desk)(root), cn = cns(root, mode), mf = mfs(root), bar = root.querySelector('#bar');
    const range = mode === 'port' ? RANGE_PORT : RANGE_DESK;
    const K1 = (mode === 'port' ? FILM_PORT : FILM_DESK) / range;
    const K2 = (mode === 'port' ? MFS_AT_PORT : MFS_AT_DESK) / range;
    a.renderer = {
      render(P, now, dp, dt) {
        base.render(Math.min(1, P / K1), now, P < K1 ? dp / K1 : 0, dt);
        cn.render(clamp((P - K1) / (K2 - K1)));
        mf.render(clamp((P - K2) / (1 - K2)));
        bar.style.transform = `scaleX(${P})`;
      },
      destroy() { base.destroy(); cn.destroy(); mf.destroy(); }
    };
    a.cur = targetOf(a);
    let last = performance.now(), prev = a.cur;
    const ease = mode === 'port' ? .16 : .11; // lighter smoothing on touch so it tracks iOS momentum
    const tick = now => {
      if (active !== a) return;
      const t = targetOf(a);
      a.cur += (t - a.cur) * ease;
      if (Math.abs(t - a.cur) < 1e-4) a.cur = t;
      const dt = Math.min(64, now - last); last = now;
      a.renderer.render(a.cur, now, a.cur - prev, dt);
      prev = a.cur;
      a.raf = requestAnimationFrame(tick);
    };
    a.raf = requestAnimationFrame(tick);
  }
  const modeNow = () => mqPort.matches ? 'port' : 'desk';
  // keep stage-height var fresh (dynamic toolbar on mobile) without re-mounting
  addEventListener('resize', () => { if (active) active.root.style.setProperty('--sh', active.stage.offsetHeight + 'px'); });
  const remount = () => { const p = progressNow(); mount(modeNow(), p); };
  mqPort.addEventListener('change', remount);   // orientation flip / crossing 1024px
  mqRM.addEventListener('change', remount);

  mount(modeNow(), 0);
  if (location.hash === '' && 'scrollRestoration' in history) history.scrollRestoration = 'manual';

  // test / debug hook
  window.__tril = { mode: () => active && active.mode, progress: progressNow, goTo, scrollers: () => document.querySelectorAll('.scroller').length };
})();
</script>

<script src="/js/free-key.js"></script>
